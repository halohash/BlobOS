
<!doctype html>
<html lang="en">
<head>
<script>
window.beaver = "1.1";
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d6e3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Browser">
<link rel="icon" href="/icons/browser.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons">
<link rel="apple-touch-icon" href="/icons/browser.png">
<link rel="stylesheet" href="./style.css">
<title>Browser</title>
</head>
<body>
<header class="topbar">
  <button class="icon-button" id="homeButton" aria-label="Home" title="Home">
    <span class="material-icons">home</span>
  </button>

  <div class="address-wrap">
    <span class="lock material-icons" id="securityIcon">public</span>
    <input id="address" type="text" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="Search or enter address">
    <button class="small-button" id="goButton">Go</button>
  </div>

  <button class="icon-button" id="tabsButton" aria-label="Tabs" title="Tabs">
    <span id="tabCount">1</span>
  </button>

  <button class="icon-button" id="menuButton" aria-label="Menu" title="Menu">
    <span class="material-icons">more_vert</span>
  </button>
</header>

<nav class="toolbar" aria-label="Browser navigation">
  <button id="backButton" title="Back" disabled>
    <span class="material-icons">arrow_back</span>
  </button>
  <button id="forwardButton" title="Forward" disabled>
    <span class="material-icons">arrow_forward</span>
  </button>
  <button id="reloadButton" title="Reload">
    <span class="material-icons">refresh</span>
  </button>
  <div class="toolbar-spacer"></div>
  <span class="page-title" id="pageTitle">New tab</span>
</nav>

<main id="viewport">
  <section id="newTab" class="new-tab">
    <div class="logo">
      <img src="/icons/browser.png" alt="">
      <span>Browser</span>
    </div>

    <div class="search-card">
      <input id="homeSearch" type="text" placeholder="Search or enter address" autocomplete="off">
      <button id="homeGo">Go</button>
    </div>

    <div class="section-heading">SITES</div>
    <div id="siteShortcuts" class="shortcuts">
      <span class="loading">Loading sites…</span>
    </div>
    <p class="home-note">Browse sites available in the database.</p>
  </section>

  <iframe id="pageFrame" title="Web page" referrerpolicy="strict-origin-when-cross-origin" hidden></iframe>

  <section id="errorPage" class="error-page" hidden>
    <div class="error-icon">
      <span class="material-icons">sentiment_dissatisfied</span>
    </div>
    <h2>Web page not available</h2>
    <p id="errorMessage">This site could not be found.</p>
    <button id="errorHome">
      <span class="material-icons">home</span>
      Go to homepage
    </button>
  </section>
</main>

<footer class="bottom-bar">
  <span id="statusText">Ready</span>
  <span>Browser</span>
</footer>

<div id="menuPanel" class="popup" hidden>
  <button data-action="newtab">
    <span class="material-icons">add</span> New tab
  </button>
  <button data-action="bookmarks">
    <span class="material-icons">bookmark_border</span> Bookmarks
  </button>
  <button data-action="share">
    <span class="material-icons">share</span> Share page
  </button>
  <button data-action="about">
    <span class="material-icons">info_outline</span> About Browser
  </button>
</div>

<div id="tabsPanel" class="tabs-panel" hidden>
  <div class="tabs-head">
    <strong>Tabs</strong>
    <button id="closeTabs">
      <span class="material-icons">close</span>
    </button>
  </div>
  <div id="tabsList"></div>
  <button id="newTabButton" class="new-tab-button">
    <span class="material-icons">add</span> New tab
  </button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="./app.js" defer></script>
</body>
</html>
