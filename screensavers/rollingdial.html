
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolling Dial</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: linear-gradient(
        160deg,
        #5ab9ba 0 30%,
        #8fc04d 31% 55%,
        #f4b400 56% 75%,
        #e2574c 76%
    );
    font-family: Roboto, Arial, sans-serif;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="screensaver"></canvas>

<script>
(() => {
    "use strict";

    const canvas = document.getElementById("screensaver");
    const ctx = canvas.getContext("2d");

    const dialImage = new Image();
    const phoneImage = new Image();
    const headphonesImage = new Image();

    dialImage.src = "/icons/dial.png";
    phoneImage.src = "/icons/phone.png";
    headphonesImage.src = "/icons/headphones.png";

    // Physics settings
    const GRAVITY = 0.0019;
    const JUMP_FORCE = -0.82;
    const DIAL_RADIUS = 36;

    // World settings
    const DIAL_SCREEN_POSITION = 0.28;
    const OBSTACLE_DISTANCE_MIN = 280;
    const OBSTACLE_DISTANCE_MAX = 540;
    const GRID_SIZE = 110;

    let width = 0;
    let height = 0;
    let groundY = 0;
    let horizonY = 0;

    let lastTime = 0;

    let dial;
    let cameraX = 0;

    let objects = [];
    let particles = [];

    let state = "running";
    let restartTimer = 0;

    let worldCursor = 0;

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * dpr;
        canvas.height = height * dpr;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        horizonY = height * 0.47;
        groundY = height * 0.82;

        if (dial) {
            cameraX = dial.x - width * DIAL_SCREEN_POSITION;
        }
    }

    window.addEventListener("resize", resize);

    // Generate a new random obstacle
    function generateObstacle() {
        const type = Math.random() < 0.62
            ? "phone"
            : "headphones";

        const size = type === "phone"
            ? 48 + Math.random() * 16
            : 57 + Math.random() * 15;

        const obj = {
            type,
            x: worldCursor,
            y: groundY - size / 2,
            width: size,
            height: size,
            squashed: false,
            squash: 1,
            attempted: false,

            // Randomize when the dial decides to jump.
            // Positive values make it jump earlier.
            // Negative values make it jump later.
            jumpDistance: 175 + (Math.random() - 0.5) * 260
        };

        objects.push(obj);

        worldCursor +=
            OBSTACLE_DISTANCE_MIN +
            Math.random() * (
                OBSTACLE_DISTANCE_MAX - OBSTACLE_DISTANCE_MIN
            );
    }

    function generateWorld() {
        objects = [];

        worldCursor = dial.x + width * 0.85;

        for (let i = 0; i < 8; i++) {
            generateObstacle();
        }
    }

    function reset() {
        dial = {
            x: 0,
            y: groundY - DIAL_RADIUS,

            radius: DIAL_RADIUS,

            vx: width * 0.00035,
            vy: 0,

            rotation: 0,

            squash: 1,
            stretch: 1,

            onGround: true
        };

        cameraX = dial.x - width * DIAL_SCREEN_POSITION;

        particles = [];
        state = "running";
        restartTimer = 0;

        generateWorld();
    }

    // Camera position follows the dial
    function updateCamera() {
        const targetX = dial.x - width * DIAL_SCREEN_POSITION;

        cameraX += (targetX - cameraX) * 0.12;
    }

    // Convert world coordinates into screen coordinates
    function screenX(worldX) {
        return worldX - cameraX;
    }

    function drawFloor() {
        const gradient = ctx.createLinearGradient(
            0,
            horizonY,
            0,
            height
        );

        gradient.addColorStop(
            0,
            "rgba(255,255,255,0.02)"
        );

        gradient.addColorStop(
            1,
            "rgba(0,0,0,0.25)"
        );

        ctx.fillStyle = gradient;

        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        ctx.lineTo(width, horizonY);
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        // Perspective grid
        ctx.save();

        ctx.strokeStyle = "rgba(255,255,255,0.25)";
        ctx.lineWidth = 1;

        const vanishingX = width / 2;

        // Moving vertical grid lines
        const firstGrid = Math.floor(
            cameraX / GRID_SIZE
        ) - 2;

        const lastGrid = Math.ceil(
            (cameraX + width) / GRID_SIZE
        ) + 2;

        for (let i = firstGrid; i <= lastGrid; i++) {
            const worldPosition = i * GRID_SIZE;
            const x = screenX(worldPosition);

            ctx.beginPath();
            ctx.moveTo(vanishingX, horizonY);
            ctx.lineTo(x, height);
            ctx.stroke();
        }

        // Horizontal perspective grid lines
        for (let i = 0; i < 18; i++) {
            const t = i / 18;

            const y = horizonY +
                t * t * (height - horizonY);

            ctx.globalAlpha = 0.12 + t * 0.25;

            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
        }

        ctx.restore();

        // Horizon glow
        const glow = ctx.createLinearGradient(
            0,
            horizonY - 15,
            0,
            horizonY + 30
        );

        glow.addColorStop(
            0,
            "rgba(255,255,255,0)"
        );

        glow.addColorStop(
            0.5,
            "rgba(255,255,255,0.3)"
        );

        glow.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );

        ctx.fillStyle = glow;
        ctx.fillRect(0, horizonY - 15, width, 45);
    }

    function drawShadow(x, y, radius, opacity = 0.3) {
        ctx.save();

        ctx.globalAlpha = opacity;
        ctx.fillStyle = "#000";

        ctx.beginPath();

        ctx.ellipse(
            x,
            y,
            radius * 1.4,
            radius * 0.28,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();
        ctx.restore();
    }

    function drawImage(image, x, y, w, h) {
        if (!image.complete || !image.naturalWidth) {
            return;
        }

        ctx.drawImage(
            image,
            x - w / 2,
            y - h / 2,
            w,
            h
        );
    }

    function drawObjects() {
        for (const obj of objects) {
            const x = screenX(obj.x);

            // Don't render objects outside the camera
            if (x < -150 || x > width + 150) {
                continue;
            }

            if (obj.type === "phone") {
                if (obj.squashed && obj.squash <= 0.02) {
                    continue;
                }

                drawShadow(
                    x,
                    groundY - 2,
                    24
                );

                ctx.save();

                ctx.translate(x, obj.y);

                ctx.scale(
                    1,
                    obj.squash
                );

                drawImage(
                    phoneImage,
                    0,
                    0,
                    obj.width,
                    obj.height
                );

                ctx.restore();
            }

            if (obj.type === "headphones") {
                drawShadow(
                    x,
                    groundY - 2,
                    27
                );

                drawImage(
                    headphonesImage,
                    x,
                    obj.y,
                    obj.width,
                    obj.height
                );
            }
        }
    }

    function drawDial() {
        const x = screenX(dial.x);

        drawShadow(
            x,
            groundY - 2,
            dial.radius,
            dial.onGround ? 0.35 : 0.15
        );

        if (!dialImage.complete || !dialImage.naturalWidth) {
            return;
        }

        ctx.save();

        ctx.translate(x, dial.y);

        ctx.rotate(dial.rotation);

        ctx.scale(
            dial.squash,
            dial.stretch
        );

        ctx.drawImage(
            dialImage,
            -dial.radius,
            -dial.radius,
            dial.radius * 2,
            dial.radius * 2
        );

        ctx.restore();
    }

    // Explosion effect
    function explode(x, y) {
        state = "exploding";

        particles = [];

        for (let i = 0; i < 65; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 10;

            particles.push({
                x,
                y,

                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,

                size: 3 + Math.random() * 9,
                life: 1,

                color: [
                    "#5ab9ba",
                    "#8fc04d",
                    "#f4b400",
                    "#e2574c",
                    "#ffffff"
                ][Math.floor(Math.random() * 5)]
            });
        }
    }

    function drawParticles(dt) {
        for (const p of particles) {
            p.x += p.vx * dt * 0.06;
            p.y += p.vy * dt * 0.06;

            p.vy += 0.0005 * dt;
            p.life -= dt * 0.001;

            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size * p.life,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }

        ctx.globalAlpha = 1;

        particles = particles.filter(
            p => p.life > 0
        );
    }

    // Main physics update
    function update(dt) {
        if (state === "exploding") {
            restartTimer += dt;

            if (restartTimer > 1800) {
                reset();
            }

            return;
        }

        if (state !== "running") {
            return;
        }

        // Continuous movement
        dial.vx = width * 0.00035;

        dial.x += dial.vx * dt;

        // Rolling rotation
        dial.rotation +=
            (dial.vx * dt) / dial.radius;

        // Gravity
        dial.vy += GRAVITY * dt;
        dial.y += dial.vy * dt;

        // Floor collision
        if (dial.y >= groundY - dial.radius) {
            if (!dial.onGround) {
                dial.squash = 1.18;
                dial.stretch = 0.82;
            }

            dial.y = groundY - dial.radius;
            dial.vy = 0;
            dial.onGround = true;
        } else {
            dial.onGround = false;
        }

        // Restore dial shape
        const recovery = Math.min(1, dt * 0.012);

        dial.squash += (1 - dial.squash) * recovery;
        dial.stretch += (1 - dial.stretch) * recovery;

        // Generate new obstacles ahead of the camera
        while (
            worldCursor < cameraX + width * 2.5
        ) {
            generateObstacle();
        }

        // Process obstacles
        for (const obj of objects) {
            const distance = obj.x - dial.x;

            if (obj.type === "phone") {
                if (obj.squashed) {
                    obj.squash = Math.max(
                        0,
                        obj.squash - dt * 0.004
                    );

                    continue;
                }

                // Squash phone when the dial rolls over it
                const touchingPhone =
                    Math.abs(distance) <
                    dial.radius + obj.width * 0.38;

                const verticallyTouching =
                    dial.y + dial.radius >
                    groundY - obj.height;

                if (
                    touchingPhone &&
                    verticallyTouching &&
                    dial.onGround
                ) {
                    obj.squashed = true;
                    obj.squash = 0.12;

                    dial.squash = 1.22;
                    dial.stretch = 0.78;

                    // Small bounce after squishing
                    dial.vy = -0.22;
                    dial.onGround = false;
                }
            }

            if (obj.type === "headphones") {
                // Each obstacle only gets one jump attempt
                if (
                    !obj.attempted &&
                    distance <= obj.jumpDistance
                ) {
                    obj.attempted = true;

                    if (dial.onGround) {
                        dial.vy = JUMP_FORCE;
                        dial.onGround = false;

                        dial.stretch = 1.25;
                        dial.squash = 0.82;
                    }
                }

                // Headphone collision
                const horizontalCollision =
                    Math.abs(distance) <
                    dial.radius + obj.width * 0.38;

                const headphoneTop =
                    groundY - obj.height;

                const verticalCollision =
                    dial.y + dial.radius > headphoneTop + 3 &&
                    dial.y - dial.radius <
                    groundY;

                if (
                    horizontalCollision &&
                    verticalCollision
                ) {
                    explode(
                        screenX(dial.x),
                        dial.y
                    );

                    return;
                }
            }
        }

        // Remove obstacles far behind the camera
        objects = objects.filter(
            obj => obj.x > cameraX - 250
        );

        // Follow dial with camera
        updateCamera();
    }

    function render(dt) {
        ctx.clearRect(
            0,
            0,
            width,
            height
        );

        drawFloor();

        drawObjects();

        if (state === "running") {
            drawDial();
        }

        if (state === "exploding") {
            drawParticles(dt);
        }
    }

    function loop(timestamp) {
        if (!lastTime) {
            lastTime = timestamp;
        }

        const dt = Math.min(
            timestamp - lastTime,
            40
        );

        lastTime = timestamp;

        update(dt);
        render(dt);

        requestAnimationFrame(loop);
    }

    // Initialize
    resize();
    reset();

    requestAnimationFrame(loop);

})();
</script>

</body>
</html>
