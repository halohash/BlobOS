
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teal Dreams</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #002b32;
}

body {
    position: relative;
    font-family: Arial, sans-serif;
}



#wallpaper {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at 50% 100%,
            #07545a 0%,
            transparent 65%
        ),
        radial-gradient(
            ellipse at 20% 20%,
            #06434b 0%,
            transparent 65%
        ),
        linear-gradient(
            160deg,
            #001b23,
            #00343b 55%,
            #001c25
        );
}



#ambient {
    position: absolute;
    inset: -30%;
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(0, 255, 220, 0.08),
            transparent 45%
        );
    animation: ambient 12s ease-in-out infinite alternate;
}

@keyframes ambient {
    from {
        transform: scale(0.85) rotate(0deg);
        opacity: 0.4;
    }

    to {
        transform: scale(1.2) rotate(20deg);
        opacity: 1;
    }
}



#lightCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}



#icons {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.floating-icon {
    position: absolute;
    object-fit: contain;
    opacity: 0;
    mix-blend-mode: screen;
    filter: brightness(1.5) saturate(0.8);
    will-change: transform, opacity;
    animation: floatIcon var(--duration) ease-in-out forwards;
}

@keyframes floatIcon {
    0% {
        opacity: 0;
        transform:
            translate3d(0, 35px, 0)
            rotate(var(--rotation));
    }

    15% {
        opacity: var(--icon-opacity);
    }

    75% {
        opacity: var(--icon-opacity);
    }

    100% {
        opacity: 0;
        transform:
            translate3d(var(--drift), -120px, 0)
            rotate(calc(var(--rotation) + 25deg));
    }
}



#vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0, 8, 15, 0.35) 100%
    );
}
</style>
</head>

<body>

<div id="wallpaper">
    <div id="ambient"></div>

    <canvas id="lightCanvas"></canvas>

    <div id="icons"></div>

    <div id="vignette"></div>
</div>

<script>
(() => {
    "use strict";

    const canvas = document.getElementById("lightCanvas");
    const ctx = canvas.getContext("2d");
    const iconContainer = document.getElementById("icons");

    const icons = [
"/icons/apptray.png",
"/icons/back.png",
"/icons/browser.png",
"/icons/calculator-kitkat.png",
"/icons/calendar-kitkat.png",
"/icons/chrome.png",
"/icons/clock.png",
"/icons/dial.png",
"/icons/downloads.png",
"/icons/drive-kitkat.png",
"/icons/earth-kitkat.png",
"/icons/email-kitkat.png",
"/icons/gallery.png",
"/icons/gmail-kitkat.png",
"/icons/google-plus.png",
"/icons/google-search-kitkat.png",
"/icons/google-settings-kitkat.png",
"/icons/google-settings.png",
"/icons/google2014.png",
"/icons/googleplus2011.png",
"/icons/hangouts-kitkat.png",
"/icons/headphones.png",
"/icons/home.png",
"/icons/keep-kitkat.png",
"/icons/maps-kitkat.png",
"/icons/mic.png",
"/icons/newsstand.png",
"/icons/ondemand.png",
"/icons/people-kitkat.png",
"/icons/phone-kitkat.png",
"/icons/phone.png",
"/icons/photos-kitkat.pn",
"/icons/play-books-kitkat.png",
"/icons/play-games-kitkat.png",
"/icons/play-movies-kitkat.png",
"/icons/play-music-kitkat.png",
"/icons/recent.png",
"/icons/system.png"
    ];

    let width = 0;
    let height = 0;

    const beams = [];
    const particles = [];

    const random = (min, max) =>
        Math.random() * (max - min) + min;

    const choose = array =>
        array[Math.floor(Math.random() * array.length)];

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * dpr;
        canvas.height = height * dpr;

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resize);
    resize();

    

    function randomColor() {
        const colors = [
            [0, 255, 220],
            [0, 180, 255],
            [80, 255, 160],
            [80, 200, 255],
            [170, 100, 255],
            [255, 100, 180],
            [255, 190, 80],
            [255, 255, 255],
            [40, 255, 255],
            [120, 255, 80]
        ];

        return choose(colors);
    }

    function rgba(color, alpha) {
        return `rgba(${color[0]},${color[1]},${color[2]},${alpha})`;
    }

    

    function createBeam() {
        const color = randomColor();

        const beam = {
            x: random(-width * 0.1, width * 1.1),
            y: random(height, height + 200),
            speed: random(0.3, 1.4),
            drift: random(-0.5, 0.5),
            width: random(25, 110),
            height: random(180, 450),
            opacity: random(0.08, 0.3),
            color: color,
            orbSpacing: random(25, 65),
            phase: random(0, Math.PI * 2),
            orbs: []
        };

        const count = Math.floor(
            beam.height / beam.orbSpacing
        );

        for (let i = 0; i < count; i++) {
            beam.orbs.push({
                offset: i * beam.orbSpacing,
                size: random(1.5, 5),
                opacity: random(0.25, 0.9),
                glow: random(5, 22),
                phase: random(0, Math.PI * 2)
            });
        }

        return beam;
    }

    

    function createParticle() {
        return {
            x: random(0, width),
            y: random(0, height),
            size: random(0.5, 2.5),
            speed: random(0.15, 0.65),
            opacity: random(0.1, 0.65),
            color: randomColor(),
            phase: random(0, Math.PI * 2)
        };
    }

    for (let i = 0; i < 18; i++) {
        beams.push(createBeam());
    }

    for (let i = 0; i < 100; i++) {
        particles.push(createParticle());
    }

    

    function drawBeam(beam, time) {
        const wave = Math.sin(
            time * 0.0005 + beam.phase
        ) * 12;

        const gradient = ctx.createLinearGradient(
            beam.x + wave,
            beam.y,
            beam.x + wave,
            beam.y - beam.height
        );

        gradient.addColorStop(0, "transparent");
        gradient.addColorStop(
            0.5,
            rgba(beam.color, beam.opacity)
        );
        gradient.addColorStop(1, "transparent");

        ctx.fillStyle = gradient;

        ctx.fillRect(
            beam.x + wave - beam.width / 2,
            beam.y - beam.height,
            beam.width,
            beam.height
        );

        

        beam.orbs.forEach(orb => {
            const orbY = beam.y - orb.offset;

            const flicker = (
                Math.sin(time * 0.002 + orb.phase) + 1
            ) / 2;

            const alpha = orb.opacity * (
                0.45 + flicker * 0.55
            );

            const orbX = beam.x + wave +
                Math.sin(time * 0.0008 + orb.phase) * 12;

            const glow = ctx.createRadialGradient(
                orbX, orbY, 0,
                orbX, orbY, orb.glow
            );

            glow.addColorStop(
                0,
                rgba(beam.color, alpha)
            );

            glow.addColorStop(1, "transparent");

            ctx.fillStyle = glow;

            ctx.beginPath();
            ctx.arc(
                orbX,
                orbY,
                orb.glow,
                0,
                Math.PI * 2
            );
            ctx.fill();

            

            ctx.fillStyle = rgba(
                [255, 255, 255],
                alpha * 0.75
            );

            ctx.beginPath();
            ctx.arc(
                orbX,
                orbY,
                orb.size,
                0,
                Math.PI * 2
            );
            ctx.fill();
        });

        

        ctx.strokeStyle = rgba(
            beam.color,
            beam.opacity * 0.6
        );

        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(beam.x + wave, beam.y);
        ctx.lineTo(
            beam.x + wave,
            beam.y - beam.height
        );
        ctx.stroke();
    }

    

    function drawParticle(particle, time) {
        const flicker = (
            Math.sin(time * 0.002 + particle.phase) + 1
        ) / 2;

        const alpha = particle.opacity * flicker;

        const glow = ctx.createRadialGradient(
            particle.x,
            particle.y,
            0,
            particle.x,
            particle.y,
            particle.size * 8
        );

        glow.addColorStop(
            0,
            rgba(particle.color, alpha)
        );

        glow.addColorStop(1, "transparent");

        ctx.fillStyle = glow;

        ctx.beginPath();
        ctx.arc(
            particle.x,
            particle.y,
            particle.size * 8,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle = rgba(
            [255, 255, 255],
            alpha
        );

        ctx.beginPath();
        ctx.arc(
            particle.x,
            particle.y,
            particle.size,
            0,
            Math.PI * 2
        );
        ctx.fill();

        particle.y -= particle.speed;

        particle.x += Math.sin(
            time * 0.0005 + particle.phase
        ) * 0.15;

        if (particle.y < -10) {
            Object.assign(
                particle,
                createParticle(),
                { y: height + 10 }
            );
        }
    }

    

    function animate(time) {
        ctx.clearRect(0, 0, width, height);

        ctx.save();
        ctx.globalCompositeOperation = "screen";

        beams.forEach((beam, index) => {
            drawBeam(beam, time);

            beam.y -= beam.speed;
            beam.x += beam.drift;

            if (beam.y - beam.height < -100) {
                beams[index] = createBeam();
            }
        });

        particles.forEach(particle => {
            drawParticle(particle, time);
        });

        ctx.restore();

        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    

    function spawnIcon() {
        const img = document.createElement("img");

        img.className = "floating-icon";
        img.src = choose(icons);
        img.alt = "";

        const size = random(24, 85);
        const duration = random(9, 20);
        const opacity = random(0.12, 0.55);
        const rotation = random(-25, 25);
        const drift = random(-100, 100);

        img.style.width = size + "px";
        img.style.height = size + "px";

        img.style.left = random(
            0,
            Math.max(0, width - size)
        ) + "px";

        img.style.top = random(
            0,
            Math.max(0, height - size)
        ) + "px";

        img.style.setProperty(
            "--duration",
            duration + "s"
        );

        img.style.setProperty(
            "--icon-opacity",
            opacity
        );

        img.style.setProperty(
            "--rotation",
            rotation + "deg"
        );

        img.style.setProperty(
            "--drift",
            drift + "px"
        );

        iconContainer.appendChild(img);

        img.addEventListener("animationend", () => {
            img.remove();
        });

        img.addEventListener("error", () => {
            img.remove();
        });
    }

    

    function scheduleIcon() {
        spawnIcon();

        setTimeout(
            scheduleIcon,
            random(500, 1800)
        );
    }

    

    for (let i = 0; i < 12; i++) {
        setTimeout(() => {
            spawnIcon();
        }, i * 250);
    }

    scheduleIcon();

})();
</script>

</body>
</html>
